name: Static app checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify required files
        run: |
          test -s index.html
          test -s README.md
          test -s docs/PRD.md
          test -s docs/ARCHITECTURE.md
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert scripts, 'No inline JavaScript found'
          Path('/tmp/freshmart-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/freshmart-inline.js
