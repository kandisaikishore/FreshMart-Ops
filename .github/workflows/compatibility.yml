name: Compatibility checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  static-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static entry point
        run: |
          set -eu
          test -s index.html
          grep -qi '<!doctype html' index.html
          grep -qi 'name="viewport"' index.html
          grep -qi 'charset="utf-8"' index.html
      - name: Validate inline JavaScript syntax and local asset references
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(m => m[1].trim()).filter(Boolean);
          scripts.forEach((script, i) => new vm.Script(script, { filename: 'inline-script-' + (i + 1) + '.js' }));
          const refs = [...html.matchAll(/(?:src|href)=["']([^"'#]+)["']/gi)]
            .map(m => m[1])
            .filter(value => !/^(?:https?:|data:|mailto:|javascript:|\/\/)/i.test(value));
          const missing = refs.filter(ref => {
            const clean = decodeURIComponent(ref.split('?')[0]);
            return clean && !fs.existsSync(clean);
          });
          if (missing.length) {
            console.error('Missing local asset references:', [...new Set(missing)].join(', '));
            process.exit(1);
          }
          console.log('Inline JavaScript syntax and local references passed.');
          NODE
