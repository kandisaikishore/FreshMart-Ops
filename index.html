function dashboard(){let sales=salesToday(),bars=[45,58,52,72,65,82,100],cats=[...new Set(state.products.map(p=>p.category))].map(c=>({name:c,n:state.products.filter(p=>p.category===c).length})).sort((a,b)=>b.n-a.n),tx=state.transactions.slice(0,5);return `<div class="welcome"><div><h2>Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'} 👋</h2><p>Here’s what’s happening at your store today.</p></div><button class="primary" onclick="go('pos')">＋ New sale</button></div><div class="cards">${stat("Today's sales",money(sales),'₹','Demo transaction data')}${stat('Transactions',state.transactions.filter(t=>t.date===today()).length,'▣','Recorded sales')}${stat('Low-stock items',lowStock().length,'⚠',lowStock().length?'Reorder recommended':'Stock levels look good')}${stat('Expiring in 7 days',expiring().length,'◷','Check freshness dates')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h3>Sales overview</h3><div class="panel-sub">Illustrative weekly activity · INR</div></div><div class="legend"><span><i class="dot"></i>Sales</span><span><i class="dot light"></i>Previous</span></div></div><div class="chart">${bars.map((h,i)=>`<div class="bar-group"><div class="bar ${i===6?'today':''}" style="height:${h}%"></div><span class="bar-label">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div><div class="footer-note">Chart is illustrative demo data; transaction totals below are calculated from local records.</div></section><section class="panel"><div class="panel-head"><div><h3>Inventory mix</h3><div class="panel-sub">Products by category</div></div><button class="outline" onclick="go('inventory')">View all</button></div><div class="category-list">${cats.slice(0,5).map(c=>`<div class="cat-row"><span>${esc(c.name)}</span><div class="track"><div class="fill" style="width:${Math.round(c.n/state.products.length*100)}%"></div></div><strong>${c.n}</strong></div>`).join('')}</div></section></div><div class="section-row"><section class="panel"><div class="panel-head"><div><h3>Recent transactions</h3><div class="panel-sub">Latest recorded checkout activity</div></div><button class="outline" onclick="go('reports')">View reports</button></div>${tx.length?`<div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Time</th><th>Payment</th><th>Total</th></tr></thead><tbody>${tx.map(t=>`<tr><td><strong>${esc(t.id)}</strong></td><td>${esc(t.time||t.date)}</td><td>${pill(esc(t.payment))}</td><td><strong>${money(t.total)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transactions yet.</div>'}</section><section class="panel"><div class="panel-head"><div><h3>Needs attention</h3><div class="panel-sub">Stock and freshness alerts</div></div></div><div class="alert-list">${lowStock().slice(0,3).map(p=>`<div class="alert"><div class="alert-icon">⚠</div><div><strong>${esc(p.name)} ${pill('Low stock','low')}</strong><small>${p.stock} units left · reorder at ${p.reorder}</small></div></div>`).join('')||'<div class="empty">No low-stock products.</div>'}${expiring().slice(0,2).map(p=>`<div class="alert"><div class="alert-icon">◷</div><div><strong>${esc(p.name)} ${pill('Expiring soon','warn')}</strong><small>Expiry: ${esc(p.expiry)}</small></div></div>`).join('')}</div></section></div>`}
function inventory(){return `<div class="welcome"><div><h2>Inventory</h2><p>Manage products, pricing, stock levels and expiry dates.</p></div><button class="primary" onclick="openProductModal()">＋ Add product</button></div><div class="page-tools"><input class="field" id="inventory-search" placeholder="Search name, SKU or barcode…" value="${esc(searchTerm)}"><select class="field" id="category-filter"><option>All</option>${[...new Set(state.products.map(p=>p.category))].sort().map(c=>`<option ${categoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button class="outline" onclick="exportProducts()">Export CSV</button></div><p class="toolbar-note">${state.products.length} products · ${lowStock().length} below reorder threshold · expiry alerts use entered batch dates.</p><section class="panel"><div class="table-wrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Reorder at</th><th>Expiry</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.products.filter(p=>(categoryFilter==='All'||p.category===categoryFilter)&&(!searchTerm||(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(searchTerm.toLowerCase()))).map(p=>`<tr><td>${productCell(p)}</td><td><strong>${money(p.price)}</strong><small class="muted" style="display:block">Tax ${p.tax}%</small></td><td>${p.stock<=p.reorder?pill(p.stock+' units','low'):p.stock<2*p.reorder?pill(p.stock+' units','warn'):pill(p.stock+' units')}</td><td>${p.reorder}</td><td>${esc(p.expiry||'—')}</td><td>${p.stock<=p.reorder?pill('Reorder','low'):expiring().some(x=>x.id===p.id)?pill('Expiring','warn'):pill('In stock')}</td><td><button class="outline" onclick="editProduct(${p.id})">Edit</button> <button class="secondary" onclick="adjustStock(${p.id})">± Stock</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No matching products.</td></tr>'}</tbody></table></div></section>`}
function pos(){const categories=['All',...new Set(state.products.map(p=>p.category))],filtered=state.products.filter(p=>(categoryFilter==='All'||p.category===categoryFilter)&&(!searchTerm||(p.name+' '+p.sku).toLowerCase().includes(searchTerm.toLowerCase()))),subtotal=cart.reduce((s,c)=>{let p=state.products.find(p=>p.id===c.id);return s+(p?p.price*c.qty:0)},0),taxable=cart.reduce((s,c)=>{let p=state.products.find(p=>p.id===c.id);return s+(p?p.price*c.qty*(p.tax||0)/100:0)},0),disc=Math.min(subtotal,Math.max(0,discount)),total=subtotal-disc+taxable;return `<div class="welcome"><div><h2>Point of Sale</h2><p>Search products and add them to the checkout basket.</p></div><button class="outline" onclick="clearCart()">Clear cart</button></div><div class="pos-layout"><section class="panel"><div class="page-tools"><input class="field" id="pos-search" placeholder="Search product or scan barcode…" value="${esc(searchTerm)}"><select class="field" id="pos-category">${categories.map(c=>`<option ${categoryFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="product-grid">${filtered.map(p=>`<button class="product-tile" onclick="addCart(${p.id})" ${p.stock<=0?'disabled':''}><div class="emoji">${p.emoji||'📦'}</div><strong>${esc(p.name)}</strong><small>${esc(p.sku)} · ${p.stock} available</small><span class="price">${money(p.price)}</span></button>`).join('')||'<div class="empty">No products match your search.</div>'}</div></section><section class="panel"><div class="panel-head"><div><h3>Current sale</h3><div class="panel-sub">${cart.reduce((s,c)=>s+c.qty,0)} items in basket</div></div>${pill('Open')}</div><div>${cart.length?cart.map(c=>{let p=state.products.find(p=>p.id===c.id);return p?`<div class="cart-line"><div><strong>${esc(p.name)}</strong><small>${money(p.price)} each · ${p.tax}% tax</small><div class="qty"><button onclick="changeQty(${p.id},-1)">−</button><b>${c.qty}</b><button onclick="changeQty(${p.id},1)">+</button><button class="danger" onclick="removeCart(${p.id})">Remove</button></div></div><strong>${money(p.price*c.qty)}</strong></div>`:''}).join(''):'<div class="empty"><b>Your basket is empty</b>Select a product to start a sale.</div>'}</div><div class="form-field" style="margin-top:15px"><label>Discount (₹)</label><input type="number" min="0" id="discount-input" value="${discount}" onchange="setDiscount(this.value)"></div><div class="form-field" style="margin-top:12px"><label>Payment method</label><select class="field" style="width:100%" id="payment-method"><option>UPI</option><option>Cash</option><option>Card</option></select></div><div class="totals"><div class="total-line"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="total-line"><span>Discount</span><strong>−${money(disc)}</strong></div><div class="total-line"><span>Estimated item tax</span><strong>${money(taxable)}</strong></div><div class="total-line grand"><span>Total due</span><span>${money(total)}</span></div></div><button class="primary" style="width:100%" onclick="checkout()" ${cart.length?'':'disabled'}>Complete sale · ${money(total)}</button><p class="footer-note">Demo checkout records payment method only; it does not process real payments. Tax totals are estimates based on product settings.</p></section></div>`}
function purchases(){return `<div class="welcome"><div><h2>Purchasing</h2><p>Receive stock from suppliers and keep inventory up to date.</p></div><button class="primary" onclick="openPurchaseModal()">＋ Receive stock</button></div><section class="panel"><div class="panel-head"><div><h3>Goods received</h3><div class="panel-sub">Receipts increase on-hand quantity.</div></div></div>${state.purchases.length?`<div class="table-wrap"><table><thead><tr><th>Reference</th><th>Date</th><th>Supplier</th><th>Product</th><th>Quantity</th><th>Unit cost</th><th>Total</th></tr></thead><tbody>${state.purchases.slice().reverse().map(x=>`<tr><td>${esc(x.ref)}</td><td>${esc(x.date)}</td><td>${esc(x.supplier)}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${money(x.cost)}</td><td><strong>${money(x.qty*x.cost)}</strong></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>No purchase receipts yet</b>Use “Receive stock” to record incoming goods.</div>'}</section>`}
function suppliers(){return `<div class="welcome"><div><h2>Suppliers</h2><p>Maintain supplier contacts and payment terms.</p></div><button class="primary" onclick="openSupplierModal()">＋ Add supplier</button></div><div class="cards">${stat('Active suppliers',state.suppliers.length,'♧','Supplier directory')}${stat('Products supplied',new Set(state.products.map(p=>p.supplier)).size,'▤','Across inventory')}${stat('Purchase receipts',state.purchases.length,'⇄','Recorded receipts')}${stat('Stock value',money(state.products.reduce((s,p)=>s+p.stock*p.cost,0)),'₹','Estimated cost value')}</div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Supplier</th><th>Contact</th><th>Phone</th><th>Email</th><th>Terms</th></tr></thead><tbody>${state.suppliers.map(s=>`<tr><td><div class="product-cell"><div class="product-thumb">♧</div><strong>${esc(s.name)}</strong></div></td><td>${esc(s.contact)}</td><td>${esc(s.phone)}</td><td>${esc(s.email)}</td><td>${pill(esc(s.terms))}</td></tr>`).join('')}</tbody></table></div></section>`}
function reports(){const tx=state.transactions,total=tx.reduce((s,t)=>s+t.total,0),gross=tx.reduce((s,t)=>s+t.items.reduce((v,i)=>{let p=state.products.find(p=>p.id===i.id);return v+(p?(p.price-p.cost)*i.qty:0)},0),0),payment={},top={};tx.forEach(t=>{payment[t.payment]=(payment[t.payment]||0)+t.total;t.items.forEach(i=>{let p=state.products.find(p=>p.id===i.id);if(p)top[p.name]=(top[p.name]||0)+i.qty})});return `<div class="welcome"><div><h2>Reports & insights</h2><p>Summaries derived from recorded demo transactions.</p></div><button class="outline" onclick="exportTransactions()">Export transactions CSV</button></div><div class="report-kpis"><div class="report-kpi"><small>Recorded sales total</small><strong>${money(total)}</strong></div><div class="report-kpi"><small>Transaction count</small><strong>${tx.length}</strong></div><div class="report-kpi"><small>Estimated gross margin*</small><strong>${money(gross)}</strong></div></div><div class="two-col"><section class="panel"><div class="panel-head"><div><h3>Payment method mix</h3><div class="panel-sub">Recorded transaction totals</div></div></div><div class="category-list">${Object.entries(payment).map(([k,v])=>`<div class="cat-row"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${Math.round(v/Math.max(1,total)*100)}%"></div></div><strong>${money(v)}</strong></div>`).join('')||'<div class="empty">No sales recorded.</div>'}</div></section><section class="panel"><div class="panel-head"><div><h3>Top-selling products</h3><div class="panel-sub">Units in recorded transactions</div></div></div><div class="table-wrap"><table><thead><tr><th>Product</th><th>Units</th></tr></thead><tbody>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([n,q])=>`<tr><td>${esc(n)}</td><td><strong>${q}</strong></td></tr>`).join('')||'<tr><td colspan="2">No data</td></tr>'}</tbody></table></div></section></div><section class="panel" style="margin-top:17px"><div class="panel-head"><div><h3>Transaction ledger</h3><div class="panel-sub">All locally stored sales</div></div></div><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Items</th><th>Discount</th><th>Tax</th><th>Payment</th><th>Total</th></tr></thead><tbody>${tx.map(t=>`<tr><td>${esc(t.id)}</td><td>${esc(t.date)}</td><td>${t.items.reduce((s,i)=>s+i.qty,0)}</td><td>${money(t.discount)}</td><td>${money(t.tax)}</td><td>${esc(t.payment)}</td><td><strong>${money(t.total)}</strong></td></tr>`).join('')}</tbody></table></div><p class="footer-note">*Margin estimate uses current product cost values, not historical cost snapshots. Demo data is not audited accounting data.</p></section>`}
function staff(){return `<div class="welcome"><div><h2>Staff & roles</h2><p>Demo staff directory and intended role model.</p></div><button class="primary" onclick="openStaffModal()">＋ Add staff</button></div><div class="alert" style="margin-bottom:16px"><div class="alert-icon">🔐</div><div><strong>Demo-only access model</strong><small>This prototype does not authenticate users or enforce server-side permissions. Connect a backend before real employee accounts.</small></div></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Staff member</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${state.staff.map(s=>`<tr><td><div class="product-cell"><div class="avatar">${esc(s.name.split(' ').map(n=>n[0]).join('').slice(0,2))}</div><strong>${esc(s.name)}</strong></div></td><td>${esc(s.email)}</td><td>${pill(esc(s.role))}</td><td>${pill(esc(s.status))}</td></tr>`).join('')}</tbody></table></div></section>`}
function settings(){return `<div class="welcome"><div><h2>Store settings</h2><p>Configure store identity and receipt preferences.</p></div><button class="primary" onclick="saveSettings()">Save settings</button></div><div class="two-col"><section class="panel"><div class="panel-head"><h3>Store profile</h3></div><div class="form-grid"><div class="form-field full"><label>Store name</label><input id="setting-store" value="${esc(state.settings.store)}"></div><div class="form-field full"><label>Address</label><input id="setting-address" value="${esc(state.settings.address)}"></div><div class="form-field full"><label>GSTIN (optional)</label><input id="setting-gstin" value="${esc(state.settings.gstin)}" placeholder="Enter business GSTIN if applicable"></div><div class="form-field full"><label>Receipt footer</label><input id="setting-footer" value="${esc(state.settings.receiptFooter)}"></div><div class="form-field"><label>Default reorder threshold</label><input type="number" id="setting-reorder" min="0" value="${state.settings.reorderDefault}"></div></div></section><section class="panel"><div class="panel-head"><h3>Data & compliance</h3></div><div class="alert"><div class="alert-icon">💾</div><div><strong>Browser-local storage</strong><small>Records remain in this browser on this device; there is no server sync or backup.</small></div></div><div class="alert" style="margin-top:10px"><div class="alert-icon">🧾</div><div><strong>GST configuration required</strong><small>Review applicable tax rates and invoice fields. This demo is not a GST compliance engine.</small></div></div><button class="outline" style="width:100%;margin-top:15px" onclick="downloadBackup()">Download data backup (JSON)</button><button class="danger" style="width:100%;margin-top:9px" onclick="resetDemo()">Reset to demo data</button></section></div>`}
function render(){const views={dashboard,pos,inventory,purchases,suppliers,reports,staff,settings};$('#content').innerHTML=views[page]();if(page==='inventory'){$('#inventory-search').addEventListener('input',e=>{searchTerm=e.target.value;render();const el=$('#inventory-search');el.focus();el.setSelectionRange(searchTerm.length,searchTerm.length)});$('#category-filter').addEventListener('change',e=>{categoryFilter=e.target.value;render()})}if(page==='pos'){$('#pos-search').addEventListener('input',e=>{searchTerm=e.target.value;render();const el=$('#pos-search');el.focus();el.setSelectionRange(searchTerm.length,searchTerm.length)});$('#pos-category').addEventListener('change',e=>{categoryFilter=e.target.value;render()})}}
function addCart(id){const p=state.products.find(p=>p.id===id);if(!p||p.stock<=0)return notify('No stock available');let c=cart.find(c=>c.id===id);if(c){if(c.qty>=p.stock)return notify('Cannot exceed available stock');c.qty++}else cart.push({id,qty:1});render()}function changeQty(id,n){let c=cart.find(c=>c.id===id),p=state.products.find(p=>p.id===id);if(!c)return;c.qty+=n;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);if(c.qty>p.stock)c.qty=p.stock;render()}function removeCart(id){cart=cart.filter(c=>c.id!==id);render()}function clearCart(){cart=[];discount=0;render()}function setDiscount(v){discount=Math.max(0,Number(v)||0);render()}
function checkout(){if(!cart.length)return;for(const c of cart){const p=state.products.find(p=>p.id===c.id);if(!p||p.stock<c.qty)return notify('Stock changed. Review your basket.')}const subtotal=cart.reduce((s,c)=>s+state.products.find(p=>p.id===c.id).price*c.qty,0),tax=cart.reduce((s,c)=>{let p=state.products.find(p=>p.id===c.id);return s+p.price*c.qty*(p.tax||0)/100},0),disc=Math.min(subtotal,discount),total=subtotal-disc+tax,transaction={id:'FM-'+Date.now().toString().slice(-7),date:today(),time:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),items:cart.map(c=>({...c})),subtotal,discount:disc,tax,total,payment:$('#payment-method').value};cart.forEach(c=>state.products.find(p=>p.id===c.id).stock-=c.qty);state.transactions.unshift(transaction);state.activity.unshift({date:new Date().toISOString(),event:'Sale completed',detail:transaction.id});save();cart=[];discount=0;render();notify('Sale recorded successfully');showReceipt(transaction)}
function showReceipt(t){const rows=t.items.map(i=>{const p=state.products.find(p=>p.id===i.id);return `<tr><td>${esc(p?.name||'Product')} × ${i.qty}</td><td>${money((p?.price||0)*i.qty)}</td></tr>`}).join('');openModal('Receipt',`<div id="receipt"><center><h2>${esc(state.settings.store)}</h2><p>${esc(state.settings.address)}</p><p>Receipt: ${esc(t.id)}<br>${esc(t.date)} ${esc(t.time)}</p></center><table>${rows}</table><hr><p>Subtotal: <b>${money(t.subtotal)}</b></p><p>Discount: <b>${money(t.discount)}</b></p><p>Estimated tax: <b>${money(t.tax)}</b></p><h3>Total: ${money(t.total)}</h3><p>Payment: ${esc(t.payment)}</p><center>${esc(state.settings.receiptFooter)}</center></div><button class="primary" style="width:100%;margin-top:15px" onclick="window.print()">Print receipt</button>`)}function openModal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;$('#modal-backdrop').classList.add('open')}function closeModal(){$('#modal-backdrop').classList.remove('open')}$('#modal-close').addEventListener('click',closeModal);$('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});
function openProductModal(id=null){const p=id?state.products.find(x=>x.id===id):{sku:'',name:'',category:'Staples',price:0,cost:0,tax:5,stock:0,reorder:10,expiry:'',supplier:'',batch:'',emoji:'📦'};openModal(id?'Edit product':'Add product',`<form id="product-form" class="form-grid"><div class="form-field"><label>SKU / Barcode *</label><input name="sku" required value="${esc(p.sku)}"></div><div class="form-field"><label>Product name *</label><input name="name" required value="${esc(p.name)}"></div><div class="form-field"><label>Category</label><input name="category" required value="${esc(p.category)}"></div><div class="form-field"><label>Emoji / icon</label><input name="emoji" value="${esc(p.emoji)}"></div><div class="form-field"><label>Selling price (₹) *</label><input name="price" type="number" min="0" step=".01" required value="${p.price}"></div><div class="form-field"><label>Cost price (₹)</label><input name="cost" type="number" min="0" step=".01" value="${p.cost}"></div><div class="form-field"><label>Tax rate (%)</label><input name="tax" type="number" min="0" max="100" step=".01" value="${p.tax}"></div><div class="form-field"><label>Current stock</label><input name="stock" type="number" min="0" value="${p.stock}"></div><div class="form-field"><label>Reorder threshold</label><input name="reorder" type="number" min="0" value="${p.reorder}"></div><div class="form-field"><label>Expiry date</label><input name="expiry" type="date" value="${esc(p.expiry)}"></div><div class="form-field"><label>Supplier</label><input name="supplier" value="${esc(p.supplier)}"></div><div class="form-field"><label>Batch number</label><input name="batch" value="${esc(p.batch)}"></div><div class="form-field full"><button class="primary" style="width:100%">Save product</button></div></form>`);$('#product-form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.id=id||Math.max(0,...state.products.map(x=>x.id))+1;['price','cost','tax','stock','reorder'].forEach(k=>d[k]=Number(d[k])||0);if(id)state.products=state.products.map(x=>x.id===id?d:x);else state.products.push(d);state.activity.unshift({date:new Date().toISOString(),event:id?'Product updated':'Product created',detail:d.name});save();closeModal();render();notify('Product saved')}}function editProduct(id){openProductModal(id)}
function adjustStock(id){const p=state.products.find(p=>p.id===id);openModal('Adjust stock',`<p>${esc(p.name)} · Current stock: <b>${p.stock}</b></p><form id="stock-form" class="form-grid"><div class="form-field"><label>Adjustment (+/- units)</label><input name="delta" type="number" required value="1"></div><div class="form-field"><label>Reason</label><select name="reason"><option>Stock count</option><option>Damaged goods</option><option>Return</option><option>Correction</option></select></div><div class="form-field full"><button class="primary" style="width:100%">Apply adjustment</button></div></form>`);$('#stock-form').onsubmit=e=>{e.preventDefault();const d=Number(new FormData(e.target).get('delta'));if(p.stock+d<0)return notify('Stock cannot be negative');p.stock+=d;state.activity.unshift({date:new Date().toISOString(),event:'Stock adjusted',detail:p.name+' '+d});save();closeModal();render();notify('Stock updated')}}
function openPurchaseModal(){openModal('Receive stock',`<form id="purchase-form" class="form-grid"><div class="form-field full"><label>Product</label><select name="product" required>${state.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.sku)}</option>`).join('')}</select></div><div class="form-field full"><label>Supplier</label><select name="supplier" required>${state.suppliers.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="form-field"><label>Quantity received</label><input name="qty" type="number" min="1" required value="10"></div><div class="form-field"><label>Unit cost (₹)</label><input name="cost" type="number" min="0" step=".01" required value="0"></div><div class="form-field"><label>Batch number</label><input name="batch"></div><div class="form-field"><label>Expiry date</label><input name="expiry" type="date"></div><div class="form-field full"><button class="primary" style="width:100%">Record goods received</button></div></form>`);$('#purchase-form').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),p=state.products.find(p=>p.id===Number(d.product)),qty=Number(d.qty);p.stock+=qty;if(d.cost)p.cost=Number(d.cost);if(d.batch)p.batch=d.batch;if(d.expiry)p.expiry=d.expiry;p.supplier=d.supplier;state.purchases.push({ref:'GRN-'+Date.now().toString().slice(-6),date:today(),supplier:d.supplier,product:p.name,productId:p.id,qty,cost:Number(d.cost)});state.activity.unshift({date:new Date().toISOString(),event:'Goods received',detail:p.name+' × '+qty});save();closeModal();render();notify('Stock receipt recorded')}}
function openSupplierModal(){openModal('Add supplier',`<form id="supplier-form" class="form-grid"><div class="form-field full"><label>Supplier name *</label><input name="name" required></div><div class="form-field"><label>Contact person</label><input name="contact"></div><div class="form-field"><label>Phone</label><input name="phone"></div><div class="form-field"><label>Email</label><input name="email" type="email"></div><div class="form-field"><label>Payment terms</label><input name="terms" value="Net 7"></div><div class="form-field full"><button class="primary" style="width:100%">Save supplier</button></div></form>`);$('#supplier-form').onsubmit=e=>{e.preventDefault();state.suppliers.push({...Object.fromEntries(new FormData(e.target)),id:Math.max(0,...state.suppliers.map(s=>s.id))+1});save();closeModal();render();notify('Supplier added')}}
function openStaffModal(){openModal('Add staff member',`<form id="staff-form" class="form-grid"><div class="form-field full"><label>Full name *</label><input name="name" required></div><div class="form-field full"><label>Email *</label><input name="email" type="email" required></div><div class="form-field"><label>Role</label><select name="role"><option>Cashier</option><option>Manager</option><option>Admin</option></select></div><div class="form-field"><label>Status</label><select name="status"><option>Active</option><option>Inactive</option></select></div><div class="form-field full"><button class="primary" style="width:100%">Add staff</button></div></form>`);$('#staff-form').onsubmit=e=>{e.preventDefault();state.staff.push({...Object.fromEntries(new FormData(e.target)),id:Math.max(0,...state.staff.map(s=>s.id))+1});save();closeModal();render();notify('Staff record added')}}
function saveSettings(){state.settings.store=$('#setting-store').value.trim()||'FreshMart Supermarket';state.settings.address=$('#setting-address').value.trim();state.settings.gstin=$('#setting-gstin').value.trim();state.settings.receiptFooter=$('#setting-footer').value.trim();state.settings.reorderDefault=Number($('#setting-reorder').value)||0;save();notify('Settings saved')}function csvDownload(filename,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));a.download=filename;a.click();URL.revokeObjectURL(a.href)}function exportProducts(){csvDownload('freshmart-inventory.csv',[['SKU','Name','Category','Price INR','Cost INR','Tax %','Stock','Reorder','Expiry','Supplier'],...state.products.map(p=>[p.sku,p.name,p.category,p.price,p.cost,p.tax,p.stock,p.reorder,p.expiry,p.supplier])])}function exportTransactions(){csvDownload('freshmart-transactions.csv',[['Receipt','Date','Time','Subtotal','Discount','Tax estimate','Total INR','Payment','Item count'],...state.transactions.map(t=>[t.id,t.date,t.time,t.subtotal,t.discount,t.tax,t.total,t.payment,t.items.reduce((s,i)=>s+i.qty,0)])])}function downloadBackup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='freshmart-backup.json';a.click();URL.revokeObjectURL(a.href)}function resetDemo(){if(!confirm('Reset all local data to the original demo dataset? This cannot be undone.'))return;state=structuredClone(defaultState);cart=[];discount=0;save();render();notify('Demo data restored')}render();
</script></body></html>
